# autonomy.conf - shared constants for the SeaParser autonomy runner.
# Sourced by run.sh (bash) and parsed by work_session.py and ssh_probe.py.
# Format: plain KEY=value lines only - no quotes, no spaces, no shell syntax,
# so bash and Python interpret the file identically. No secrets belong here.
#
# MODEL is a pinned decision, not a tunable: project rules forbid switching
# model. The value below is the model already in use in work_session.py
# (MODEL = 'gpt-6.1-sol') and run.sh; this file only mirrors it, it does not
# introduce a new model choice. Any change still requires explicit user
# approval before merge.
#
# SSH_HEAD and HEAD are two different pinned commits and are NOT
# interchangeable:
#   SSH_HEAD - the commit proven by the SSH-disconnect probe receipt
#              (logs/ssh-probe-bd5600c/latest.json). run.sh and
#              work_session.py verify the probe's before/after commits
#              against this value.
#   HEAD     - the expected initial worktree commit for a work pass.
#              work_session.py verifies `git rev-parse HEAD` in WORKDIR
#              against this value (and the branch development/real-map-data).
# They differ because the worktree advanced past the probe commit after the
# probe was recorded; the probe receipt stays bound to the commit it proved.
# Neither value is trusted blindly: both are checked against git and the
# receipt, and a mismatch aborts with a clear error.
#
# Updating the HEAD pin (handoff routine): HEAD is intentionally hardcoded so
# a pass can never start from an unexpected commit. When the worktree is
# handed off at a new commit, update HEAD here in the same reviewed change as
# HANDOFF.md/resume-worktree.json, then run the format/parity check below.
# SSH_HEAD only changes when a new SSH-disconnect probe receipt is recorded.
#
# Verification (run before every handoff; both must pass):
#   bash -n autonomy.conf && bash -c 'set -a; . ./autonomy.conf; set +a; env | grep -E "^(BASE|WORKDIR|CODEX|MODEL|REASONING|SOCKET|SESSION|PROBE_ROOT|LOGROOT|SSH_HEAD|HEAD)="'
#   python3 -B -c 'import re,sys; ks="BASE WORKDIR CODEX MODEL REASONING SOCKET SESSION PROBE_ROOT LOGROOT SSH_HEAD HEAD".split(); d={}; [d.__setitem__(m.group(1),m.group(2)) for m in (re.fullmatch(r"([A-Z_]+)=([^\s\"\x27]+)",l) for l in open("autonomy.conf").read().splitlines() if l and not l.startswith("#")) if m]; assert sorted(d)==sorted(ks), (sorted(d),sorted(ks)); print(d)'
# Both commands must print the same KEY=value pairs; any line that does not
# match ^[A-Z_]+=[^[:space:]"']+$ is rejected by the Python check.
BASE=/home/web/seaparser/autonomy
WORKDIR=/home/web/seaparser/worktrees/real-map-data
CODEX=/home/web/seaparser/.local/bin/codex
MODEL=gpt-6.1-sol
REASONING=medium
SOCKET=/home/web/seaparser/autonomy/tmux.sock
SESSION=seaparser-autonomy-work
PROBE_ROOT=/home/web/seaparser/autonomy/logs/codex-start-probe
LOGROOT=/home/web/seaparser/autonomy/logs/work-five-hours
SSH_HEAD=bd5600c602a8896dbfbcf6b185729ce44483d2e4
HEAD=563f56af93914a63143bfcc2481e455ee29e75df
